<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>If Earth Held a Fixed Magnet — Upside Down Learning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#F4ECD8;
    --brown:#3D2817;
    --tan:#8B6F47;
    --stone:#3F3226;
    --rule:#C9B693;
    --paper:#FBF6EA;
    --needle:#3D2817;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--parchment);
    color:var(--brown);
    font-family:'Courier Prime','Courier New',monospace;
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:24px 20px 40px}

  header{border-bottom:2px solid var(--brown);padding-bottom:12px;margin-bottom:20px}
  h1{font-size:1.55rem;font-weight:700;letter-spacing:.06em;margin:0}
  .sub{color:var(--stone);font-size:.85rem;margin-top:4px;letter-spacing:.04em}

  .stage{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;align-items:start;max-width:900px}
  @media (max-width:820px){.stage{grid-template-columns:1fr}}

  .board{
    background:var(--paper);
    border:2px solid var(--brown);
    position:relative;
  }
  canvas{display:block;width:100%;height:auto;touch-action:none;cursor:grab}
  canvas.dragging{cursor:grabbing}
  canvas:focus{outline:3px solid var(--tan);outline-offset:-3px}

  .hint{
    background:var(--parchment);
    border-top:2px solid var(--brown);
    padding:8px 12px;font-size:.78rem;color:var(--stone);
  }

  .panel{display:flex;flex-direction:column;gap:16px}

  .readout{border:2px solid var(--brown);background:var(--paper);padding:14px}
  .readout h2{font-size:.72rem;letter-spacing:.14em;margin:0 0 10px;color:var(--brown);font-weight:700}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:5px 0;border-bottom:1px dotted var(--rule)}
  .row:last-child{border-bottom:0}
  .row .k{font-size:.78rem;color:var(--stone)}
  .row .v{font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums}

  .polar{border:2px solid var(--brown);background:var(--paper);padding:14px}
  .polar h2{font-size:.72rem;letter-spacing:.14em;margin:0 0 10px;color:var(--brown);font-weight:700}
  .polar canvas{display:block;width:100%;height:auto;background:#FFFFFF;border:1px solid var(--rule)}
  .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
  @media (max-width:760px){.split{grid-template-columns:minmax(0,1fr)}}
  .data{display:flex;flex-direction:column}
  .prow{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0 4px}
  .prow .k{font-size:.78rem;color:var(--stone)}
  .prow .v{font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums}
  .ptab{width:100%;border-collapse:collapse;margin:8px 0 6px;font-size:.74rem}
  .ptab th{color:var(--brown);font-weight:700;text-align:right;padding:3px 0;border-bottom:1px solid var(--rule);font-size:.68rem;letter-spacing:.04em}
  .ptab th:first-child{text-align:left}
  .ptab td{padding:3px 0;border-bottom:1px dotted var(--rule);text-align:right;font-variant-numeric:tabular-nums}
  .ptab td:first-child{text-align:left}
  .ptab td.rec{color:#C4553B;font-weight:700}
  .pnote{font-size:.76rem;color:var(--stone);margin:0 0 10px;min-height:2.4em;line-height:1.35}
  .polar button{width:100%;margin-top:6px;text-align:center}
  .data .pnote{margin-bottom:auto}
  .polar .cmp{margin-top:12px;border-top:1px solid var(--rule);padding-top:10px}
  .pcap{font-size:.68rem;letter-spacing:.1em;color:var(--brown);font-weight:700;margin-top:6px}

  .controls{display:flex;flex-direction:column;gap:8px}
  button{
    font-family:inherit;font-size:.86rem;font-weight:700;
    background:var(--tan);color:#FBF6EA;
    border:2px solid var(--brown);padding:9px 12px;
    text-align:left;cursor:pointer;
  }
  button:hover:not(:disabled){background:var(--brown);color:var(--parchment)}
  button:disabled{background:var(--paper);color:var(--rule);border-color:var(--rule);cursor:default}
  button:focus-visible{outline:3px solid var(--tan);outline-offset:2px}
  button.ghost{background:var(--paper);color:var(--brown);border-style:dashed;font-weight:400}

  .toggles{border:2px solid var(--brown);background:var(--paper);padding:12px 14px}
  .toggles h2{font-size:.72rem;letter-spacing:.14em;margin:0 0 8px;color:var(--brown);font-weight:700}
  label.tog{display:flex;gap:9px;align-items:flex-start;padding:5px 0;cursor:pointer;font-size:.84rem}
  label.tog input{margin-top:3px;accent-color:var(--brown);width:15px;height:15px;flex:none}

  footer{margin-top:26px;padding-top:12px;border-top:1px solid var(--rule);
    font-size:.72rem;color:var(--stone);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>IF EARTH HELD A FIXED MAGNET</h1>
    <div class="sub">Test the model against the record.</div>
  </header>

  <div class="stage">

    <div class="panel">

      <div class="polar">
        <h2>LOOKING DOWN ON THE POLE</h2>
        <div class="split">
          <div class="disc">
            <canvas id="pc" width="520" height="520" aria-label="A view looking down on the pole, with a marker for each recorded position."></canvas>
          </div>
          <div class="data">
            <div class="prow"><span class="k">Survey year</span><span class="v" id="rYears">&mdash;</span></div>
            <div class="pcap">DISTANCE MOVED SINCE THE LAST SURVEY</div>
            <table class="ptab" id="pTab"><tbody></tbody></table>
            <div class="pnote" id="pNote">No positions recorded yet.</div>
            <button id="bTick">Record the next survey year</button>
            <button id="bReset" class="ghost">Start over</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <footer>
    <span>Upside Down Learning</span>
    <span>Pole positions from NOAA NCEI. Distances are great-circle distances between successive records.</span>
  </footer>

</div>

<script>
(function(){
  "use strict";
  var css = getComputedStyle(document.documentElement);
  var C = { brown: css.getPropertyValue('--brown').trim(),
            tan:   css.getPropertyValue('--tan').trim(),
            rule:  css.getPropertyValue('--rule').trim() };

  var pc = document.getElementById('pc'), pctx = pc.getContext('2d');
  var PW = pc.width, PH = pc.height;
  var PCX = PW/2, PCY = PH/2, PR = Math.min(PW,PH)*0.40;
  var idx = -1, records = [];

  // recorded positions of Earth's north magnetic pole, with the distance moved
  // between successive records. Speed is left for students to work out.
  var EARTH = [
    {y:1831, lat:70.1, lon:-96.8,  km:null},
    {y:1904, lat:70.5, lon:-96.2,  km:50},
    {y:1948, lat:73.9, lon:-100.9, km:410},
    {y:1962, lat:75.1, lon:-100.6, km:134},
    {y:1973, lat:76.0, lon:-100.6, km:100},
    {y:1984, lat:77.0, lon:-102.3, km:120},
    {y:1994, lat:78.3, lon:-104.0, km:150},
    {y:2001, lat:81.3, lon:-110.8, km:359},
    {y:2007, lat:84.0, lon:-120.7, km:331},
    {y:2025, lat:85.8, lon:139.3,  km:878}
  ];

  function polarXY(lat, lon){
    var rr = PR * (90 - lat) / 26;                    // rim of the disc sits at 64 N
    var th = (lon + 100) * Math.PI/180;               // same framing as the case map
    return { x: PCX + rr*Math.sin(th), y: PCY + rr*Math.cos(th) };
  }

  function drawPolar(){
    pctx.clearRect(0,0,PW,PH);
    pctx.save();
    pctx.strokeStyle = C.rule; pctx.lineWidth = 2;
    for (var k=1;k<=3;k++){ pctx.beginPath(); pctx.arc(PCX,PCY,PR*k/3,0,Math.PI*2); pctx.stroke(); }
    for (var a=0;a<8;a++){
      var th = a*Math.PI/4;
      pctx.beginPath(); pctx.moveTo(PCX,PCY);
      pctx.lineTo(PCX+PR*Math.cos(th), PCY+PR*Math.sin(th)); pctx.stroke();
    }
    pctx.restore();

    {
      pctx.save();
      for (var e=0;e<=idx && e<EARTH.length;e++){
        var q = polarXY(EARTH[e].lat, EARTH[e].lon);
        pctx.beginPath(); pctx.arc(q.x,q.y,7,0,Math.PI*2);
        pctx.fillStyle = '#C4553B'; pctx.fill();
        pctx.lineWidth = 2; pctx.strokeStyle = '#FFFFFF'; pctx.stroke();
      }
      pctx.restore();
    }

    // every record lands on the same point, because a fixed magnet cannot move
    if (records.length){
      pctx.save();
      pctx.beginPath(); pctx.arc(PCX,PCY,11,0,Math.PI*2);
      pctx.fillStyle = C.brown; pctx.fill();
      pctx.lineWidth = 3; pctx.strokeStyle = '#FFFFFF'; pctx.stroke();
      pctx.restore();
    }
  }

  function update(){
    document.getElementById('rYears').textContent = (idx < 0) ? '\u2014' : EARTH[idx].y;
    var btn = document.getElementById('bTick');
    var done = (idx >= EARTH.length - 1);
    btn.disabled = done;
    btn.textContent = done ? 'All survey years recorded' : 'Record the next survey year';

    var note = document.getElementById('pNote');
    if (records.length === 0)      note.textContent = 'No positions recorded yet.';
    else if (records.length === 1) note.textContent = 'One survey year recorded.';
    else                           note.textContent = records.length + ' survey years recorded.';

    var tb = document.getElementById('pTab').querySelector('tbody');
    tb.innerHTML = '';
    if (idx >= 0){
      var hr = document.createElement('tr');
      hr.innerHTML = '<th>Year</th><th>Fixed magnet (km)</th><th>Real record (km)</th>';
      tb.appendChild(hr);
      for (var i=0;i<=idx;i++){
        var tr = document.createElement('tr');
        var first = (i === 0);
        tr.innerHTML = '<td>' + EARTH[i].y + '</td>' +
                       '<td>' + (first ? '\u2014' : '0') + '</td>' +
                       '<td class="rec">' + (first ? '\u2014' : EARTH[i].km) + '</td>';
        tb.appendChild(tr);
      }
    }
    drawPolar();
  }

  document.getElementById('bTick').addEventListener('click', function(){
    if (idx < EARTH.length - 1){ idx++; records.push(EARTH[idx].y); }
    update();
  });
  document.getElementById('bReset').addEventListener('click', function(){
    idx = -1; records = []; update();
  });
  update();
})();
</script>
</body>
</html>
